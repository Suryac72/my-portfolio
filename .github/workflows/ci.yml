name: CI

on:
  push:
    branches: [ release-3-0/portfolio,release-2-0/portfolio, master ]
  pull_request:
    branches: [ release-3-0/portfolio,release-2-0/portfolio, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --legacy-peer-deps

    - name: Lint
      run: npm run lint

    - name: Run Unit Tests with Coverage
      run: npm test
      env:
        # Mock env vars for CI
        NEXT_PUBLIC_SANITY_PROJECT_ID: 'test'
        NEXT_PUBLIC_SANITY_DATASET: 'test'
        PINECONE_API_KEY: 'test'
        GROQ_API_KEY: 'test'

    - name: Build
      run: npm run build
      env:
        GROQ_API_KEY: "groq_test_key"
        NEXT_PUBLIC_SANITY_PROJECT_ID: "test-project-id" 
        NEXT_PUBLIC_SANITY_DATASET: "test-dataset"
        PINECONE_API_KEY: "pinecone_test_key"
        PINECONE_INDEX: "test_index"
        GROQ_MODEL_NAME: "llama-3.1-8b-instant"
        HUGGINEFACEHUB_API_KEY: "hf_test_key"